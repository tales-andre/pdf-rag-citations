name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and evaluation (offline, no API keys)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Extractive mode: no LLM provider, no API key, no call to a model.
      LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-llm.txt

      # requirements-llm.txt only lets the tests build each provider's chat model
      # with a dummy key. No provider is called.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt -r requirements-llm.txt

      - name: pytest (LLM mode uses LangChain's fake chat model)
        run: python -m pytest

      - name: Evaluation on the sample questions (extractive mode)
        run: python -m pdfrag.evaluate --update-readme

      - name: README table and docs/eval-results.md match the fresh run
        run: git diff --exit-code -- README.md docs/eval-results.md
